name: UI acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 2s --health-retries 10
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m framework.seed_redis
      - run: python -m behave
      - run: python -m framework.report_browser allure-results ${{ matrix.browser }}
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: error

  report:
    needs: acceptance
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: allure-results
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install allure generate allure-results --single-file -o report
      - uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: report/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [acceptance, report]
    runs-on: ubuntu-latest
    environment: private-report
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: execution-report
          path: published
      - name: Publish verified report to private reports branch
        working-directory: source
        run: |
          if git fetch origin reports; then
            git switch -c reports FETCH_HEAD
          else
            git switch --orphan reports
          fi
          cp ../published/index.html index.html
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m "Publish report for ${GITHUB_SHA}" && git push origin reports


